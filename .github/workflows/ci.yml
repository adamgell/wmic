name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python -m unittest discover -s tools/reference/tests
      - run: python -m unittest discover -s tools/release/tests
      - name: Certificate identity policy tests
        shell: pwsh
        run: ./tools/release/tests/signature-policy.Tests.ps1
  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-pc-windows-msvc, x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add clippy
      - run: rustup target add ${{ matrix.target }}
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked
      - name: Portable renderer parity against Windows MSXML6
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked --test formats_msxml_parity -- --ignored --test-threads=1
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: python -m unittest discover -s tools/release/tests
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: ./tools/release/tests/signature-policy.Tests.ps1
  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: cargo test --locked

[package]
name = "wmic-compat"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "Native Windows WMIC command compatibility"

[lib]
name = "wmic_compat"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi", "Win32_Security", "Win32_System_Rpc", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_Globalization"] }

[package]
name = "wmic-compat"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "Native Windows WMIC command compatibility"

[lib]
name = "wmic_compat"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Data_Xml_MsXml", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi", "Win32_Security", "Win32_System_Rpc", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_System_IO", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
md4 = "0.10"
md-5 = "0.10"
hmac = "0.12"
rc4 = "0.1"
roxmltree = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys = "0.5"
plist = "1"

[[bin]]
name = "wmic"
path = "src/main.rs"
